name: Moonfall
options:
  bundleIdPrefix: com.andrew4coding
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 92QV2QPDKA
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
targets:
  MoonfalliOS:
    type: application
    supportedDestinations: [iOS]
    configFiles:
      Debug: iOS/MoonfalliOS.xcconfig
      Release: iOS/MoonfalliOS.xcconfig
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBonjourServices:
          - _moonfall._tcp
    sources:
      - Shared
      - path: iOS
        excludes: ["*.xcconfig"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrew4coding.Moonfall
        PRODUCT_NAME: MoonfalliOS
        # Both app targets share one module name so Tests/Shared can `@testable import Moonfall`.
        # Keep it on app targets only: on test bundles it collides with the app module.
        PRODUCT_MODULE_NAME: Moonfall
        INFOPLIST_KEY_CFBundleDisplayName: Moonfall
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Moonfall uses Bluetooth to tell which families are close to each other during the game.
        INFOPLIST_KEY_NSCameraUsageDescription: Moonfall uses the camera only to scan your family's QR code.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Moonfall connects to the game host on the event Wi-Fi so your family can play.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  MoonfalliOSTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - Tests/Shared
      - Tests/iOS
    dependencies:
      - target: MoonfalliOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrew4coding.Moonfall.Tests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MoonfalliOS.app/MoonfalliOS
        BUNDLE_LOADER: $(TEST_HOST)
  MoonfallAdminiPad:
    type: application
    supportedDestinations: [iOS]
    configFiles:
      Debug: AdminiPad/MoonfallAdminiPad.xcconfig
      Release: AdminiPad/MoonfallAdminiPad.xcconfig
    info:
      path: AdminiPad/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBonjourServices:
          - _moonfall._tcp
    sources:
      - Shared
      - path: AdminiPad
        excludes: ["*.xcconfig"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrew4coding.Moonfall.adminpad
        PRODUCT_NAME: MoonfallAdminiPad
        PRODUCT_MODULE_NAME: Moonfall
        INFOPLIST_KEY_CFBundleDisplayName: Moonfall OC
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Moonfall OC connects to the Mac host on the event Wi-Fi to control the game.
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  MoonfallAdmin:
    type: application
    supportedDestinations: [macOS]
    configFiles:
      Debug: Admin/MoonfallAdmin.xcconfig
      Release: Admin/MoonfallAdmin.xcconfig
    sources:
      - Shared
      - path: Admin
        excludes: ["*.xcconfig"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrew4coding.Moonfall.admin
        PRODUCT_NAME: MoonfallAdmin
        PRODUCT_MODULE_NAME: Moonfall
        INFOPLIST_KEY_CFBundleDisplayName: Moonfall Admin
        CODE_SIGN_ENTITLEMENTS: Admin/Resources/MoonfallAdmin.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  MoonfallAdminTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - Tests/Shared
      - Tests/Admin
    dependencies:
      - target: MoonfallAdmin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrew4coding.Moonfall.admin.Tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MoonfallAdmin.app/Contents/MacOS/MoonfallAdmin
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  MoonfalliOS:
    build:
      targets:
        MoonfalliOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MoonfalliOSTests
    archive:
      config: Release
  MoonfallAdminiPad:
    build:
      targets:
        MoonfallAdminiPad: all
    run:
      config: Debug
    archive:
      config: Release
  MoonfallAdmin-Testing:
    # Rehearsal scheme: same app, but launched with -TestingTools (see Shared/Host/TestingTools.swift).
    build:
      targets:
        MoonfallAdmin: all
    run:
      config: Debug
      commandLineArguments:
        "-TestingTools": true
  MoonfallAdmin:
    build:
      targets:
        MoonfallAdmin: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MoonfallAdminTests
    archive:
      config: Release
