name: Beta

on:
  push:
    branches: [staging]
    paths-ignore:
      - specs/**
      - "**/*.md"
      - .claude/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta
  cancel-in-progress: false

env:
  LC_ALL: en_US.UTF-8
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}

jobs:
  testflight:
    name: ${{ matrix.name }} to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MurderMysteryiOS
            lane: ios beta
          - name: MurderMysteryAdmin
            lane: mac beta
          - name: MurderMysteryAdminiPad
            lane: ios adminpad_beta
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: brew install xcodegen
      - run: bundle exec fastlane ${{ matrix.lane }}
